[project]
name = "mcpgauge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.4.0",
  "anthropic>=0.40",
  "fastapi>=0.111,<1",
  "jinja2>=3.1",
  "mcp>=1.3.0",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0.1",
  "sqlmodel>=0.0.22",
  "typer>=0.12.3",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
mcpgauge = "mcpgauge.cli:app"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "ruff>=0.4.7",
  "pytest>=8.2.2",
  "pytest-asyncio>=0.23.7",
  "pre-commit>=3.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpgauge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
anyio_mode = "auto"
testpaths = ["tests"]
